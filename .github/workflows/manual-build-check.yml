name: Manual Build Check

on:
  workflow_dispatch:
    inputs:
      check_level:
        description: "What should GitHub check?"
        required: true
        default: "Build only"
        type: choice
        options:
          - "Build only"
          - "Build + quick tests"
          - "Full tests + build"

permissions:
  contents: read

concurrency:
  group: manual-build-check
  cancel-in-progress: true

jobs:
  check:
    name: ${{ inputs.check_level }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quick tests
        if: ${{ inputs.check_level == 'Build + quick tests' }}
        run: >
          bunx vitest run
          src/lib/technical-validation.test.ts
          src/lib/question-quality.test.ts
          src/lib/lesson-quality.test.ts
          src/lib/admin/health-state.test.ts
          src/lib/admin/release.test.ts

      - name: Run full tests
        if: ${{ inputs.check_level == 'Full tests + build' }}
        run: bun run test

      - name: Build app
        run: bun run build
