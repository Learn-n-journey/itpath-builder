# Calls the IT PATH spreadsheet sync on a schedule, from GitHub's side.
# Nothing about this runs inside Lovable except the sync itself.
#
# Setup (one time, in GitHub):
#   1. Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: SYNC_SECRET
#      Value: the LINK_CHECK_TOKEN value from this Lovable project's secrets
#   2. Done. The schedule below runs on its own; you can also press
#      "Run workflow" on the Actions tab to sync on demand.

name: Nightly spreadsheet sync

on:
  schedule:
    - cron: "30 4 * * *" # 04:30 UTC every night
  workflow_dispatch: {} # allows a manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        run: |
          code=$(curl -s -o /tmp/sync-response.json -w "%{http_code}" \
            -X POST "https://itpath-builder.lovable.app/api/public/sheet-sync" \
            -H "x-cron-secret: ${{ secrets.SYNC_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"mode":"full"}')
          echo "Sync responded with HTTP $code"
          cat /tmp/sync-response.json
          if [ "$code" != "200" ]; then
            echo "::error::Sync failed (HTTP $code)"
            exit 1
          fi
