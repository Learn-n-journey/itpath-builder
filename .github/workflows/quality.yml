name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  content:
    name: Content linter and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint:content
      - run: bun run test
      - name: Quality gate (generate, test, audit, correct, retest, approve)
        run: bun run gate
      - name: Domain-neutral autonomy proof
        run: bun run autonomy

      - name: Adversarial stress test
        run: bun run stress
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: quality-ledger
          path: .quality

  lighthouse:
    name: Accessibility and performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Lighthouse CI
        run: bunx @lhci/cli@0.15.x autorun
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "false"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
